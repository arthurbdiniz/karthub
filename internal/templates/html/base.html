{{define "base"}}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}KartHub{{end}}</title>
    <script src="/static/htmx.min.js"></script>
    <script src="/static/alpine.min.js" defer></script>
    <script src="/static/sortable.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <style>[x-cloak] { display: none !important; } .sortable-ghost { opacity: 0.5; }</style>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
</head>
<body class="h-full bg-gray-50" hx-boost="true">
    {{template "nav" .}}
    <div class="h-14"></div>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {{block "content" .}}{{end}}
    </main>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js').then(function(reg) {
            // Request push permission after SW is ready
            if ('Notification' in window && Notification.permission === 'default') {
                setTimeout(function() {
                    Notification.requestPermission().then(function(perm) {
                        if (perm === 'granted') subscribePush(reg);
                    });
                }, 3000);
            } else if (Notification.permission === 'granted') {
                subscribePush(reg);
            }
        });
    }

    function subscribePush(reg) {
        fetch('/push/vapid-key').then(r => r.text()).then(function(key) {
            if (!key) return;
            reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(key)
            }).then(function(sub) {
                var keys = sub.toJSON().keys;
                var form = new FormData();
                form.append('endpoint', sub.endpoint);
                form.append('p256dh', keys.p256dh);
                form.append('auth', keys.auth);
                fetch('/push/subscribe', { method: 'POST', body: form });
            });
        });
    }

    function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var raw = window.atob(base64);
        var arr = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; ++i) arr[i] = raw.charCodeAt(i);
        return arr;
    }
    </script>
</body>
</html>
{{end}}
