{{define "title"}}Feedback - KartHub{{end}}

{{define "content"}}
<div class="max-w-lg mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-gray-900">Submit Feedback</h1>
    <p class="text-gray-500 text-sm">Help us improve the experience. Your feedback is visible to organizers.</p>

    {{if .Success}}
    <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded">
        Thanks for your feedback! 🙏
    </div>
    {{end}}

    {{if .Error}}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded">
        {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/feedback" class="bg-white rounded-lg shadow p-6 space-y-4">
        <div>
            <label for="message" class="block text-sm font-medium text-gray-700">Your feedback</label>
            <textarea id="message" name="message" rows="4" required
                placeholder="What went well? What could be better?"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2 border"></textarea>
        </div>

        <button type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            Submit Feedback
        </button>
    </form>
</div>
{{end}}
