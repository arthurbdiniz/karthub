{{define "title"}}Welcome - KartHub{{end}}

{{define "content"}}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
        <div class="flex justify-center mb-4">
            <img src="/static/icon-192.png" alt="KartHub" class="w-16 h-16 rounded-lg">
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2 text-center">Welcome to KartHub!</h1>
        <p class="text-center text-gray-500 mb-6">Set up your driver profile. Choose your nickname carefully — it's permanent and used on leaderboards.</p>

        {{if .Error}}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
            {{.Error}}
        </div>
        {{end}}

        <form method="POST" action="/setup" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label for="nickname" class="block text-sm font-medium text-gray-700">Nickname (permanent)</label>
                <input type="text" id="nickname" name="nickname" required autofocus
                    placeholder="e.g. SpeedDemon, IceMan"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2 border">
            </div>

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="name" name="name"
                    placeholder="Your real name (optional)"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2 border">
            </div>

            <div>
                <label for="country_code" class="block text-sm font-medium text-gray-700">Country (optional)</label>
                <select id="country_code" name="country_code"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2 border">
                    <option value="">No flag</option>
                    <option value="AR">🇦🇷 Argentina</option>
                    <option value="AU">🇦🇺 Australia</option>
                    <option value="AT">🇦🇹 Austria</option>
                    <option value="AZ">🇦🇿 Azerbaijan</option>
                    <option value="BE">🇧🇪 Belgium</option>
                    <option value="BR">🇧🇷 Brazil</option>
                    <option value="CA">🇨🇦 Canada</option>
                    <option value="CL">🇨🇱 Chile</option>
                    <option value="CN">🇨🇳 China</option>
                    <option value="CO">🇨🇴 Colombia</option>
                    <option value="CZ">🇨🇿 Czech Republic</option>
                    <option value="DK">🇩🇰 Denmark</option>
                    <option value="FI">🇫🇮 Finland</option>
                    <option value="FR">🇫🇷 France</option>
                    <option value="DE">🇩🇪 Germany</option>
                    <option value="HU">🇭🇺 Hungary</option>
                    <option value="IN">🇮🇳 India</option>
                    <option value="IE">🇮🇪 Ireland</option>
                    <option value="IT">🇮🇹 Italy</option>
                    <option value="JP">🇯🇵 Japan</option>
                    <option value="KR">🇰🇷 South Korea</option>
                    <option value="LV">🇱🇻 Latvia</option>
                    <option value="LT">🇱🇹 Lithuania</option>
                    <option value="MX">🇲🇽 Mexico</option>
                    <option value="NL">🇳🇱 Netherlands</option>
                    <option value="NZ">🇳🇿 New Zealand</option>
                    <option value="NG">🇳🇬 Nigeria</option>
                    <option value="NO">🇳🇴 Norway</option>
                    <option value="PL">🇵🇱 Poland</option>
                    <option value="PT">🇵🇹 Portugal</option>
                    <option value="RO">🇷🇴 Romania</option>
                    <option value="ZA">🇿🇦 South Africa</option>
                    <option value="ES">🇪🇸 Spain</option>
                    <option value="SE">🇸🇪 Sweden</option>
                    <option value="CH">🇨🇭 Switzerland</option>
                    <option value="TR">🇹🇷 Türkiye</option>
                    <option value="GB">🇬🇧 United Kingdom</option>
                    <option value="US">🇺🇸 United States</option>
                </select>
            </div>

            <div x-data="avatarCropper()" x-init="init()">
                <label class="block text-sm font-medium text-gray-700">Profile Picture</label>

                <template x-if="preview">
                    <div class="mb-2">
                        <img :src="preview" class="w-16 h-16 rounded-full object-cover">
                        <button type="button" @click="clearPreview()" class="text-xs text-red-600 mt-1">Remove</button>
                    </div>
                </template>

                <input type="file" accept="image/*" @change="onFileSelect($event)"
                    class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">

                <input type="hidden" name="avatar_cropped" :value="croppedData">

                <!-- Crop Modal -->
                <div x-show="showModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0,0,0,0.8)">
                    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden" @click.stop>
                        <div class="p-4 border-b">
                            <h3 class="text-lg font-semibold text-gray-900">Crop your photo</h3>
                        </div>
                        <div style="height: 300px; overflow: hidden;">
                            <img x-ref="cropImg" :src="imageSrc" style="display: block; max-width: 100%; opacity: 0;">
                        </div>
                        <div class="p-4 border-t bg-gray-50 flex items-center justify-between">
                            <p class="text-xs text-gray-400">Drag to reposition, pinch to zoom</p>
                            <div class="flex gap-3">
                                <button type="button" @click="cancelCrop()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Cancel</button>
                                <button type="button" @click="applyCrop()" class="px-5 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Let's Race
            </button>
        </form>
    </div>
</div>

<link rel="stylesheet" href="/static/cropper.min.css">
<style>
    .cropper-view-box,
    .cropper-face {
        border-radius: 50%;
    }
</style>
<script src="/static/cropper.min.js"></script>
<script src="/static/avatar-cropper.js"></script>
{{end}}
