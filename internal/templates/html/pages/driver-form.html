{{define "title"}}Driver Profile - KartHub{{end}}

{{define "content"}}
<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">{{if .Driver}}Edit Driver Profile{{else}}Create Driver Profile{{end}}</h1>

    <form method="POST" action="{{if .Driver}}/drivers/me{{else}}/drivers/new{{end}}" enctype="multipart/form-data" class="space-y-4 bg-white rounded-lg shadow p-6">

        {{if .Driver}}
        <div>
            <label class="block text-sm font-medium text-gray-700">Nickname</label>
            <input type="text" disabled
                value="{{if .Driver.Nickname}}{{.Driver.Nickname}}{{end}}"
                class="mt-1 block w-full rounded-md bg-gray-100 border-gray-300 text-gray-500 px-3 py-2 border cursor-not-allowed">
            <p class="mt-1 text-xs text-gray-400">Nickname cannot be changed</p>
        </div>
        {{end}}

        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
            <input type="text" id="name" name="name" required
                value="{{if .Driver}}{{.Driver.Name}}{{end}}"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2 border">
        </div>

        <div>
            <label for="country_code" class="block text-sm font-medium text-gray-700">Country Flag (optional)</label>
            <select id="country_code" name="country_code"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2 border">
                <option value="">No flag</option>
                <option value="AR" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "AR"}}selected{{end}}{{end}}{{end}}>🇦🇷 Argentina</option>
                <option value="AU" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "AU"}}selected{{end}}{{end}}{{end}}>🇦🇺 Australia</option>
                <option value="AT" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "AT"}}selected{{end}}{{end}}{{end}}>🇦🇹 Austria</option>
                <option value="BE" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "BE"}}selected{{end}}{{end}}{{end}}>🇧🇪 Belgium</option>
                <option value="BR" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "BR"}}selected{{end}}{{end}}{{end}}>🇧🇷 Brazil</option>
                <option value="CA" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "CA"}}selected{{end}}{{end}}{{end}}>🇨🇦 Canada</option>
                <option value="CL" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "CL"}}selected{{end}}{{end}}{{end}}>🇨🇱 Chile</option>
                <option value="CN" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "CN"}}selected{{end}}{{end}}{{end}}>🇨🇳 China</option>
                <option value="CO" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "CO"}}selected{{end}}{{end}}{{end}}>🇨🇴 Colombia</option>
                <option value="CZ" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "CZ"}}selected{{end}}{{end}}{{end}}>🇨🇿 Czech Republic</option>
                <option value="DK" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "DK"}}selected{{end}}{{end}}{{end}}>🇩🇰 Denmark</option>
                <option value="FI" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "FI"}}selected{{end}}{{end}}{{end}}>🇫🇮 Finland</option>
                <option value="FR" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "FR"}}selected{{end}}{{end}}{{end}}>🇫🇷 France</option>
                <option value="DE" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "DE"}}selected{{end}}{{end}}{{end}}>🇩🇪 Germany</option>
                <option value="HU" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "HU"}}selected{{end}}{{end}}{{end}}>🇭🇺 Hungary</option>
                <option value="IN" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "IN"}}selected{{end}}{{end}}{{end}}>🇮🇳 India</option>
                <option value="IE" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "IE"}}selected{{end}}{{end}}{{end}}>🇮🇪 Ireland</option>
                <option value="IT" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "IT"}}selected{{end}}{{end}}{{end}}>🇮🇹 Italy</option>
                <option value="JP" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "JP"}}selected{{end}}{{end}}{{end}}>🇯🇵 Japan</option>
                <option value="KR" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "KR"}}selected{{end}}{{end}}{{end}}>🇰🇷 South Korea</option>
                <option value="LV" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "LV"}}selected{{end}}{{end}}{{end}}>🇱🇻 Latvia</option>
                <option value="LT" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "LT"}}selected{{end}}{{end}}{{end}}>🇱🇹 Lithuania</option>
                <option value="MX" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "MX"}}selected{{end}}{{end}}{{end}}>🇲🇽 Mexico</option>
                <option value="NL" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "NL"}}selected{{end}}{{end}}{{end}}>🇳🇱 Netherlands</option>
                <option value="NZ" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "NZ"}}selected{{end}}{{end}}{{end}}>🇳🇿 New Zealand</option>
                <option value="NG" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "NG"}}selected{{end}}{{end}}{{end}}>🇳🇬 Nigeria</option>
                <option value="NO" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "NO"}}selected{{end}}{{end}}{{end}}>🇳🇴 Norway</option>
                <option value="PL" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "PL"}}selected{{end}}{{end}}{{end}}>🇵🇱 Poland</option>
                <option value="PT" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "PT"}}selected{{end}}{{end}}{{end}}>🇵🇹 Portugal</option>
                <option value="RO" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "RO"}}selected{{end}}{{end}}{{end}}>🇷🇴 Romania</option>
                <option value="ZA" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "ZA"}}selected{{end}}{{end}}{{end}}>🇿🇦 South Africa</option>
                <option value="ES" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "ES"}}selected{{end}}{{end}}{{end}}>🇪🇸 Spain</option>
                <option value="SE" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "SE"}}selected{{end}}{{end}}{{end}}>🇸🇪 Sweden</option>
                <option value="CH" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "CH"}}selected{{end}}{{end}}{{end}}>🇨🇭 Switzerland</option>
                <option value="GB" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "GB"}}selected{{end}}{{end}}{{end}}>🇬🇧 United Kingdom</option>
                <option value="US" {{if .Driver}}{{if .Driver.CountryCode}}{{if eq (deref .Driver.CountryCode) "US"}}selected{{end}}{{end}}{{end}}>🇺🇸 United States</option>
            </select>
        </div>

        <div>
            <label for="bio" class="block text-sm font-medium text-gray-700">Bio</label>
            <textarea id="bio" name="bio" rows="3"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2 border">{{if .Driver}}{{if .Driver.Bio}}{{.Driver.Bio}}{{end}}{{end}}</textarea>
        </div>

        <div>
            <label for="avatar" class="block text-sm font-medium text-gray-700">Profile Picture</label>
            {{if .Driver}}{{if .Driver.Avatar}}
            <img src="{{.Driver.Avatar | safeURL}}" alt="Current avatar" class="w-16 h-16 rounded-full object-cover mb-2">
            {{end}}{{end}}
            <input type="file" id="avatar" name="avatar" accept="image/*"
                class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            <p class="mt-1 text-xs text-gray-400">Leave empty to keep current picture</p>
        </div>

        <div class="flex justify-between items-center pt-4">
            <a href="/drivers" class="text-gray-600 hover:text-gray-800 text-sm">← Back</a>
            <button type="submit"
                class="bg-blue-600 text-white py-2 px-6 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                {{if .Driver}}Update Profile{{else}}Create Profile{{end}}
            </button>
        </div>
    </form>
</div>
{{end}}
